[package]
name = "aerotab-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "aerotab-app"
[lib]
name = "aerotab_core"
path = "src/lib.rs"

[[bin]]
name = "aerotab"
path = "src/main.rs"

[[bin]]
name = "aerotab-app"
path = "src/bin/aerotab-app.rs"
required-features = ["desktop"]

[dependencies]
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }

reqwest = { workspace = true }
russh = { workspace = true }
russh-keys = { workspace = true }
russh-sftp = { workspace = true }
portable-pty = { workspace = true }
serialport = { workspace = true }
sled = { workspace = true }
git2 = { workspace = true }
keyring = { workspace = true }

async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
base64 = { workspace = true }
quick-xml = "0.37"
wasmi = { workspace = true }
encoding_rs = "0.8"

# Official MCP SDK, Streamable HTTP and authenticated TLS listener.
rmcp = { version = "=0.8.5", features = ["base64", "macros", "server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
axum = "0.8"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
subtle = "2"
tokio-util = "0.7"

tauri = { version = "2", optional = true , features = ["tray-icon"] }
tauri-plugin-updater = { version = "2", optional = true }
rfd = { version = "0.15", optional = true }
raw-window-handle = "0.6"
alacritty_terminal = { version = "0.26", default-features = false }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
wat = "1"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "=30.0.0", optional = true, default-features = false, features = ["std", "dx12", "wgsl"] }
glyphon = { version = "=0.12.0", optional = true }
pollster = { version = "0.4", optional = true }
windows-sys = { version = "0.59", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
windows = { version = "0.58", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Memory",
  "Win32_System_DataExchange",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# crates.io objc2 bindings and wgpu Metal backend; no external Apple SDK vendoring.
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-app-kit = { version = "0.3", optional = true }
wgpu = { version = "=30.0.0", optional = true, default-features = false, features = ["std", "metal", "wgsl"] }
glyphon = { version = "=0.12.0", optional = true }
pollster = { version = "0.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
gtk = { version = "0.18.2", optional = true }
glib = { version = "0.18.5", optional = true }
glow = { version = "0.17.0", optional = true }
webkit2gtk = { version = "2.0.2", features = ["v2_40"], optional = true }

[features]
default = ["desktop"]
# Enables the Tauri 2 desktop runtime + the `aerotab-app` binary.
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-updater", "dep:rfd"]
# Feature flags for incremental wiring; toggled on as modules land.
ssh = []
serial = []
sync = []
plugins = []
native-embed = []
# Opt-in GTK native view. Unsupported platforms return an explicit error.
native-view = ["desktop", "tauri/unstable", "dep:gtk", "dep:glib", "dep:glow", "dep:webkit2gtk", "dep:wgpu", "dep:glyphon", "dep:pollster", "dep:windows-sys", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]
