[workspace]
resolver = "2"
members = ["src-tauri", "tools/bench"]

[workspace.package]
version = "0.2.18"
edition = "2021"
license = "MIT"
repository = "https://github.com/ioe/aerotab"
rust-version = "1.77"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors / logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto / sync
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"

# Networking
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

# SSH
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2.0.5"

# PTY / Serial
portable-pty = "0.8"
serialport = "4"

# Storage
sled = "0.34"

# Git
# HTTPS remotes (GitLab/GitHub) need libgit2 linked with TLS; `vendored-openssl`
# bundles OpenSSL when cross-compiling (e.g. Windows via cargo-xwin).
git2 = {
  version = "0.19",
  default-features = false,
  features = ["vendored-libgit2", "https", "vendored-openssl", "ssh"],
}

# Keychain
keyring = "2"

# Misc
base64 = "0.22"

# WASM plugin host (pure-Rust interpreter — no JIT, cross-compiles cleanly).
wasmi = "0.40"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
