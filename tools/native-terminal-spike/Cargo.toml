[package]
name = "native-terminal-spike"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "native-terminal-spike"
autobins = false

[[bin]]
name = "native-terminal-spike"
path = "src/main.rs"

[features]
windows-host = ["dep:wry"]

[[bin]]
name = "windows-host"
path = "src/bin/windows-host.rs"
required-features = ["windows-host"]

# Intentionally independent of the application's workspace and dependency/MSRV graph.
[workspace]

[dependencies]
alacritty_terminal = "=0.26.0"
glyphon = "=0.12.0"
pollster = "0.4"
portable-pty = "=0.8.1"
libc = "0.2"
serde_json = "1"
wgpu = "=30.0.0"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
wry = { version = "=0.55.1", optional = true, default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_IO", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[profile.dev]
debug = 0
