name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # GitHub 无官方 debian-latest 托管 runner；在 ubuntu 宿主上用 debian:bookworm 容器跑 Linux CI。
  rust-debian:
    name: Rust (debian-bookworm)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v5
      - name: Debian build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          # WebKitGTK 4.1 for Tauri 2 is in bookworm-backports (not enabled by default).
          echo "deb http://deb.debian.org/debian bookworm-backports main" \
            > /etc/apt/sources.list.d/bookworm-backports.list
          apt-get update
          apt-get install -y --no-install-recommends \
            curl git pkg-config build-essential \
            libssl-dev libudev-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            file wget patchelf
          apt-get install -y --no-install-recommends -t bookworm-backports \
            libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features desktop -- -D warnings
      - run: cargo test --lib --features desktop -- --test-threads=1

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features desktop -- -D warnings
      - run: cargo test --lib --features desktop -- --test-threads=1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

  release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      CI: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
          - os: ubuntu-24.04-arm
            bundle: deb-arm64
          - os: windows-latest
            bundle: nsis
          # Intel DMG: cross-compile on Apple Silicon (macos-13 Intel runners are scarce/queued).
          - os: macos-14
            bundle: dmg-intel
            rust_target: x86_64-apple-darwin
          - os: macos-14
            bundle: dmg-arm
            rust_target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - name: Read app version
        id: appver
        shell: bash
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust cross-compilation target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}
      - name: Install tauri-cli
        shell: bash
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --locked
          fi
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config libudev-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libwebkit2gtk-4.1-dev file wget patchelf
      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install pkg-config create-dmg
      - uses: Swatinem/rust-cache@v2
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/ui/package-lock.json
      - name: Build UI
        working-directory: apps/ui
        run: npm install --no-audit --no-fund && npm run build
      - name: Build deb
        if: matrix.bundle == 'deb' || matrix.bundle == 'deb-arm64'
        working-directory: src-tauri
        run: cargo tauri build --bundles deb --features desktop
      - name: Build nsis
        if: matrix.bundle == 'nsis'
        working-directory: src-tauri
        # Native Windows runner — do not use cargo-xwin (Linux→Windows cross only).
        run: cargo tauri build --bundles nsis
      - name: Build dmg (Intel)
        if: matrix.bundle == 'dmg-intel'
        working-directory: src-tauri
        env:
          # Skip Finder AppleScript layout in CI (see tauri-apps/tauri-action#1003).
          TAURI_BUNDLER_DMG_IGNORE_CI: true
        run: cargo tauri build --target x86_64-apple-darwin --bundles dmg
      - name: Build dmg (Apple Silicon)
        if: matrix.bundle == 'dmg-arm'
        working-directory: src-tauri
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: true
        # Native build on macos-14 ARM runners (no cross-target needed).
        run: cargo tauri build --bundles dmg
      - name: Resolve bundle artifact path
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.appver.outputs.version }}"
          case "${{ matrix.bundle }}" in
            deb)
              path="target/release/bundle/deb/AeroTab_${ver}_amd64.deb"
              name="AeroTab_${ver}_amd64.deb"
              ;;
            deb-arm64)
              path="target/release/bundle/deb/AeroTab_${ver}_arm64.deb"
              name="AeroTab_${ver}_arm64.deb"
              ;;
            nsis)
              # Native Windows build (not cargo-xwin cross); output is under target/release/.
              path="target/release/bundle/nsis/AeroTab_${ver}_x64-setup.exe"
              name="AeroTab_${ver}_x64-setup.exe"
              ;;
            dmg-intel)
              path="target/x86_64-apple-darwin/release/bundle/dmg/AeroTab_${ver}_x64.dmg"
              name="AeroTab_${ver}_x64.dmg"
              ;;
            dmg-arm)
              # Native build on ARM macos-14 (no --target); fall back to cross-compile path if present.
              path="target/release/bundle/dmg/AeroTab_${ver}_aarch64.dmg"
              if [ ! -f "$path" ]; then
                path="target/aarch64-apple-darwin/release/bundle/dmg/AeroTab_${ver}_aarch64.dmg"
              fi
              name="AeroTab_${ver}_aarch64.dmg"
              ;;
            *)
              echo "Unknown bundle: ${{ matrix.bundle }}" >&2
              exit 1
              ;;
          esac
          if [ ! -f "$path" ]; then
            echo "Bundle not found: $path" >&2
            find target -type f \( -name 'AeroTab_*' -o -name '*.deb' -o -name '*.dmg' -o -name '*setup.exe' \) 2>/dev/null || true
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ steps.bundle.outputs.path }}

  build-arch:
    name: Build Arch (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    container:
      image: archlinux:base-devel
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel git jq \
            rust cargo \
            webkit2gtk-4.1 gtk3 \
            libappindicator-gtk3 librsvg \
            libsoup3 openssl libxdo \
            nodejs npm patchelf libarchive
      - name: Install tauri-cli
        run: |
          cargo install tauri-cli --locked --root /usr/local
          echo "/usr/local/bin" >> "$GITHUB_PATH"
      - name: Create builder user for makepkg
        run: |
          if ! id builder >/dev/null 2>&1; then
            useradd -m -G wheel builder
          fi
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Read app version
        id: appver
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - name: Build Arch package
        run: |
          set -euo pipefail
          chmod +x tools/build-arch-pkg.sh
          su builder -c "cd '$GITHUB_WORKSPACE' && ./tools/build-arch-pkg.sh '${{ steps.appver.outputs.version }}' '${{ matrix.arch }}'"
      - name: Resolve Arch artifact path
        id: archpkg
        run: |
          set -euo pipefail
          ver="${{ steps.appver.outputs.version }}"
          path="pkg/arch/aerotab-${ver}-1-${{ matrix.arch }}.pkg.tar.zst"
          if [[ ! -f "$path" ]]; then
            echo "Arch package not found for ${{ matrix.arch }}: $path" >&2
            ls -la pkg/arch/ || true
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archpkg.outputs.name }}
          path: ${{ steps.archpkg.outputs.path }}

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [release, build-arch]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Read app version
        id: appver
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.appver.outputs.version }}"
          mkdir -p release
          shopt -s nullglob
          for dir in artifacts/*/; do
            cp -a "$dir"* release/
          done
          cd release
          sha256sum * > CHECKSUMS.sha256
          ls -la
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            See dist/RELEASE_NOTES.md for full details.

            **Artifacts (v${{ steps.appver.outputs.version }}):**
            - AeroTab_${{ steps.appver.outputs.version }}_amd64.deb (Debian/Ubuntu x86_64)
            - AeroTab_${{ steps.appver.outputs.version }}_arm64.deb (Debian/Ubuntu ARM64)
            - aerotab-${{ steps.appver.outputs.version }}-1-x86_64.pkg.tar.zst (Arch Linux x86_64)
            - aerotab-${{ steps.appver.outputs.version }}-1-aarch64.pkg.tar.zst (Arch Linux ARM64)
            - AeroTab_${{ steps.appver.outputs.version }}_x64-setup.exe (Windows x86_64)
            - AeroTab_${{ steps.appver.outputs.version }}_x64.dmg (macOS Intel)
            - AeroTab_${{ steps.appver.outputs.version }}_aarch64.dmg (macOS Apple Silicon)
