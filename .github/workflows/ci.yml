name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libudev-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features desktop -- -D warnings
      - run: cargo test --lib --features desktop -- --test-threads=1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

  release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
            artifact: 'target/release/bundle/deb/Tabby v2_0.1.0_amd64.deb'
            upload_name: Tabby_v2_0.1.0_amd64.deb
          - os: windows-latest
            bundle: nsis
            artifact: 'target/x86_64-pc-windows-msvc/release/bundle/nsis/Tabby v2_0.1.0_x64-setup.exe'
            upload_name: Tabby_v2_0.1.0_x64-setup.exe
          - os: macos-13
            bundle: dmg-intel
            rust_target: x86_64-apple-darwin
            artifact: 'target/x86_64-apple-darwin/release/bundle/dmg/Tabby v2_0.1.0_x64.dmg'
            upload_name: Tabby_v2_0.1.0_x64.dmg
          - os: macos-14
            bundle: dmg-arm
            rust_target: aarch64-apple-darwin
            artifact: 'target/aarch64-apple-darwin/release/bundle/dmg/Tabby v2_0.1.0_aarch64.dmg'
            upload_name: Tabby_v2_0.1.0_aarch64.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libudev-dev
      - uses: Swatinem/rust-cache@v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/ui/package-lock.json
      - name: Build UI
        run: cd apps/ui && npm install --no-audit --no-fund && npm run build
      - name: Build deb
        if: matrix.bundle == 'deb'
        run: cargo tauri build --bundles deb
      - name: Build nsis
        if: matrix.bundle == 'nsis'
        run: cargo tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis -- --features desktop
      - name: Build dmg (Intel)
        if: matrix.bundle == 'dmg-intel'
        run: cargo tauri build --target x86_64-apple-darwin --bundles dmg
      - name: Build dmg (Apple Silicon)
        if: matrix.bundle == 'dmg-arm'
        run: cargo tauri build --target aarch64-apple-darwin --bundles dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload_name }}
          path: ${{ matrix.artifact }}

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Prepare release files
        run: |
          mkdir -p release
          mv Tabby_v2_0.1.0_amd64.deb/Tabby_v2_0.1.0_amd64.deb release/ || true
          mv Tabby_v2_0.1.0_x64-setup.exe/Tabby_v2_0.1.0_x64-setup.exe release/ || true
          mv Tabby_v2_0.1.0_x64.dmg/Tabby_v2_0.1.0_x64.dmg release/ || true
          mv Tabby_v2_0.1.0_aarch64.dmg/Tabby_v2_0.1.0_aarch64.dmg release/ || true
          cd release && sha256sum * > CHECKSUMS.sha256 || true && ls -la
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          body: |
            See dist/RELEASE_NOTES.md for full details.
            
            **Artifacts:**
            - Tabby_v2_0.1.0_amd64.deb (Linux x86_64)
            - Tabby_v2_0.1.0_x64-setup.exe (Windows x86_64)
            - Tabby_v2_0.1.0_x64.dmg (macOS Intel)
            - Tabby_v2_0.1.0_aarch64.dmg (macOS Apple Silicon)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
