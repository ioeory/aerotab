name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # GitHub 无官方 debian-latest 托管 runner；在 ubuntu 宿主上用 debian:bookworm 容器跑 Linux CI。
  rust-debian:
    name: Rust (debian-bookworm)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v5
      - name: Debian build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          # WebKitGTK 4.1 for Tauri 2 is in bookworm-backports (not enabled by default).
          echo "deb http://deb.debian.org/debian bookworm-backports main" \
            > /etc/apt/sources.list.d/bookworm-backports.list
          apt-get update
          apt-get install -y --no-install-recommends \
            curl git pkg-config build-essential \
            libssl-dev libudev-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            file wget patchelf
          apt-get install -y --no-install-recommends -t bookworm-backports \
            libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features desktop -- -D warnings
      - run: cargo test --lib --features desktop -- --test-threads=1

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features desktop -- -D warnings
      - run: cargo test --lib --features desktop -- --test-threads=1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

  release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
            artifact: 'target/release/bundle/deb/AeroTab_0.2.5_amd64.deb'
            upload_name: AeroTab_0.2.5_amd64.deb
          - os: windows-latest
            bundle: nsis
            artifact: 'target/x86_64-pc-windows-msvc/release/bundle/nsis/AeroTab_0.2.5_x64-setup.exe'
            upload_name: AeroTab_0.2.5_x64-setup.exe
          - os: macos-13
            bundle: dmg-intel
            rust_target: x86_64-apple-darwin
            artifact: 'target/x86_64-apple-darwin/release/bundle/dmg/AeroTab_0.2.5_x64.dmg'
            upload_name: AeroTab_0.2.5_x64.dmg
          - os: macos-14
            bundle: dmg-arm
            rust_target: aarch64-apple-darwin
            artifact: 'target/aarch64-apple-darwin/release/bundle/dmg/AeroTab_0.2.5_aarch64.dmg'
            upload_name: AeroTab_0.2.5_aarch64.dmg
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust cross-compilation target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}
      - name: Install tauri-cli
        shell: bash
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --locked
          fi
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config libudev-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libwebkit2gtk-4.1-dev file wget patchelf
      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/ui/package-lock.json
      - name: Build UI
        working-directory: apps/ui
        run: npm install --no-audit --no-fund && npm run build
      - name: Build deb
        if: matrix.bundle == 'deb'
        working-directory: src-tauri
        run: cargo tauri build --bundles deb
      - name: Build nsis
        if: matrix.bundle == 'nsis'
        working-directory: src-tauri
        # Native Windows runner — do not use cargo-xwin (Linux→Windows cross only).
        run: cargo tauri build --bundles nsis
      - name: Build dmg (Intel)
        if: matrix.bundle == 'dmg-intel'
        working-directory: src-tauri
        run: cargo tauri build --target x86_64-apple-darwin --bundles dmg
      - name: Build dmg (Apple Silicon)
        if: matrix.bundle == 'dmg-arm'
        working-directory: src-tauri
        run: cargo tauri build --target aarch64-apple-darwin --bundles dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.upload_name }}
          path: ${{ matrix.artifact }}

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Prepare release files
        run: |
          mkdir -p release
          mv AeroTab_0.2.5_amd64.deb/AeroTab_0.2.5_amd64.deb release/ || true
          mv AeroTab_0.2.5_x64-setup.exe/AeroTab_0.2.5_x64-setup.exe release/ || true
          mv AeroTab_0.2.5_x64.dmg/AeroTab_0.2.5_x64.dmg release/ || true
          mv AeroTab_0.2.5_aarch64.dmg/AeroTab_0.2.5_aarch64.dmg release/ || true
          cd release && sha256sum * > CHECKSUMS.sha256 || true && ls -la
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            See dist/RELEASE_NOTES.md for full details.

            **Artifacts:**
            - AeroTab_0.2.5_amd64.deb (Linux x86_64)
            - AeroTab_0.2.5_x64-setup.exe (Windows x86_64)
            - AeroTab_0.2.5_x64.dmg (macOS Intel)
            - AeroTab_0.2.5_aarch64.dmg (macOS Apple Silicon)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
